########################################
# 1) HTTP → HTTPS redirection
########################################
server {
    listen 80;
    server_name api-demo.autocycle.dev;

    # Allow certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS
    return 301 https://$host$request_uri;
}

########################################
# 2) HTTPS Server - Reverse Proxy
########################################
server {
    listen 443 ssl http2;
    server_name api-demo.autocycle.dev;

    # SSL managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api-demo.autocycle.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-demo.autocycle.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ###################################################
    # FASTAPI BACKEND (127.0.0.1:8000)
    ###################################################
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ###################################################
    # Node server (127.0.0.1:4000)
    ###################################################
    location /node/ {
        proxy_pass http://127.0.0.1:4000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
         add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, *" always;

    # Preflight
    if ($request_method = OPTIONS) {
        add_header Access-Control-Max-Age 86400;
        return 204;
    }    
 }

    ###################################################
    # Beta frontend (127.0.0.1:8100)
    ###################################################
    location /beta/ {
        proxy_pass http://127.0.0.1:8100/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
  add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, *" always;

    # Preflight
    if ($request_method = OPTIONS) {
        add_header Access-Control-Max-Age 86400;
        return 204;
    } 
 }
}