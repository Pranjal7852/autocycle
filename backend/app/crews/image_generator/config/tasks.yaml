generate_image_task:
  description: >
    For each of the five products generated by the creative_pitch_generator, generate high-quality DALL·E image.
    that visually represents collaboration between {brand} and the target_brand from the generate_creative_pitches_task.

    Each image must include:
    - Only one product (object) from the creative_pitch_generator's product concept 
    - A minimalist, commercial-style background in modern tones such as muted pastels (beige, mustard yellow, olive green, soft blue) or bold neutrals (charcoal gray, metallic silver, deep navy)
    - Soft lighting, natural shadows, and an editorial photographic style
    - No text should be there

    The image must reflect premium aesthetics, clear co-branding, and sustainability-focused storytelling.
    Maintain consistency in styling, typography, and visual tone across all images.

  expected_output: >
      - image_url: URL of the five generated images in form of a JSON array

  agent: image_generator