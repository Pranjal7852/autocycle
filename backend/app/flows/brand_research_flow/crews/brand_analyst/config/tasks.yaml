analyze_target_brand:
  description: >
    Retrieve or generate a concise summary of brand '{brand}' using pre-indexed data sources. Focus on values, market segment, sustainability, and collaboration potential.
  expected_output: >
    {
      "brand_category": "...",
      "key_values": ["...", "..."],
      "target_audience": "...",
      "sustainability_highlights": "...",
      "collaboration_flags": ["eco-line", "open innovation", "public commitments"]
    }
  search_query: "brand analysis {brand} values market segment sustainability collaboration"
  agent: brand_researcher
