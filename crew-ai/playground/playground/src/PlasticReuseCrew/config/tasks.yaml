generate_image_task:
  description: >
    For each of the five product concepts generated by the creative_pitch_generator, generate high-quality DALL·E image.
    that visually represents a fictional upcycling collaboration between {brand}the specific brand from the match_industries_task..

    Each image must include:
    - A product concept based on the creative_pitch_generator's description
    - A central, visually focused product render (core item from {industry_match_tool.output.target_brand}, reimagined with {brand}'s design identity)
    - A minimalist, commercial-style background in modern tones (muted pastels or bold neutrals)
    - Soft lighting, natural shadows, and an editorial photographic style
    - No text should be there on the image
    - The text "{brand} × target_brand" at the top in a modern, sans-serif font
    - A tagline beneath the product that reflects the pitch theme

    The image must reflect premium aesthetics, clear co-branding, and sustainability-focused storytelling.
    Maintain consistency in styling, typography, and visual tone across all images.

  expected_output: >
      - image_url: URL of the generated images in form of a JSON array

  agent: image_generator
